version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Batch every safe, non-breaking bump into a single PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # These packages must move together, so keep major bumps grouped
      # to avoid one landing without the other and breaking the build.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
